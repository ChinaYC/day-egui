name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x86_64-gnu
            package_ext: tar.gz
            bin_ext: ""
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos-aarch64
            package_ext: tar.gz
            bin_ext: ""
            use_cross: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Install cross
        if: ${{ matrix.use_cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/pkg
          BIN_PATH="target/${{ matrix.target }}/release/eframe_template${{ matrix.bin_ext }}"
          OUT_DIR="dist/pkg/EfficiencyTool-${{ matrix.artifact_name }}"
          mkdir -p "$OUT_DIR"
          cp "$BIN_PATH" "$OUT_DIR/EfficiencyTool${{ matrix.bin_ext }}"
          if [ "${{ matrix.bin_ext }}" != ".exe" ]; then
            chmod +x "$OUT_DIR/EfficiencyTool${{ matrix.bin_ext }}"
          fi
          if [[ "${{ matrix.target }}" == *"apple-darwin"* ]]; then
            APP_DIR="$OUT_DIR/EfficiencyTool.app"
            mkdir -p "$APP_DIR/Contents/MacOS"
            mkdir -p "$APP_DIR/Contents/Resources"
            mv "$OUT_DIR/EfficiencyTool" "$APP_DIR/Contents/MacOS/EfficiencyTool"
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              '  <key>CFBundleExecutable</key>' \
              '  <string>EfficiencyTool</string>' \
              '  <key>CFBundleIdentifier</key>' \
              '  <string>com.liam.efficiencytool</string>' \
              '  <key>CFBundleName</key>' \
              '  <string>EfficiencyTool</string>' \
              '  <key>CFBundlePackageType</key>' \
              '  <string>APPL</string>' \
              '  <key>CFBundleShortVersionString</key>' \
              '  <string>1.0</string>' \
              '</dict>' \
              '</plist>' \
              > "$APP_DIR/Contents/Info.plist"
            chmod +x "$APP_DIR/Contents/MacOS/EfficiencyTool"
          fi
          if [ "${{ matrix.package_ext }}" = "zip" ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path 'dist/pkg/EfficiencyTool-${{ matrix.artifact_name }}' -DestinationPath 'dist/EfficiencyTool-${{ matrix.artifact_name }}.zip' -Force"
          else
            tar -C "dist/pkg" -czf "dist/EfficiencyTool-${{ matrix.artifact_name }}.tar.gz" "EfficiencyTool-${{ matrix.artifact_name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/EfficiencyTool-${{ matrix.artifact_name }}.*

  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install Android SDK/NDK
        shell: bash
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SDKMANAGER="${SDKROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at: $SDKMANAGER"
            find "${SDKROOT}" -maxdepth 4 -type f -name sdkmanager || true
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install --channel=3 \
            "platform-tools" \
            "platforms;android-30" \
            "platforms;android-34" \
            "build-tools;30.0.3" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264"
          echo "ANDROID_SDK_ROOT=${SDKROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${SDKROOT}/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install cargo-apk
        shell: bash
        run: cargo install cargo-apk --locked

      - name: Build APK (arm64)
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          set -o pipefail
          cargo apk build -p eframe_template --target aarch64-linux-android 2>&1 | tee build_android.log
          APK_PATH="$(ls -1 target/debug/apk/*.apk | head -n 1)"
          mkdir -p dist
          cp "$APK_PATH" "dist/EfficiencyTool-android-arm64.apk"

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build_android.log

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: dist/EfficiencyTool-android-arm64.apk

  release:
    needs: [build_desktop, build_android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: List artifacts
        shell: bash
        run: ls -la dist || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
